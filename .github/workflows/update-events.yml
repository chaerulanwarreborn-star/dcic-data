name: Build DCIC data

on:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - overrides/**
      - localization/dragon_city_localization_baseline_en.json
      - legacy/heroic_races/**
      - .github/workflows/update-events.yml
  workflow_dispatch:
    # Also run this manually (Actions tab -> Build DCIC data -> Run workflow)
    # whenever game_config.json / arena_config.json / side_events_config.json
    # change in the-void repo, since a push there can no longer trigger this
    # workflow directly (different repo). See the raw-data checkout step below.

permissions:
  contents: write

defaults:
  run:
    working-directory: dcic-data

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dcic-data
        uses: actions/checkout@v4
        with:
          path: dcic-data

      # ------------------------------------------------------------------
      # Raw game-data captures (game_config.json, arena_config.json,
      # side_events_config.json) now live in the private "the-void" repo.
      # Both repos are checked out as explicit siblings under the job's
      # workspace root (workspace/dcic-data and workspace/the-void), which
      # matches RAW_DIR's default in the scripts (REPO_ROOT.parent / "the-void").
      #
      # SETUP NEEDED (one-time, before this step will work):
      #   1. Create the "the-void" repo (private) and push game_config.json,
      #      arena_config.json, side_events_config.json to it.
      #   2. Create a fine-grained Personal Access Token with read-only
      #      access to just that repo's contents.
      #   3. In dcic-data -> Settings -> Secrets and variables -> Actions,
      #      add it as a repository secret named THE_VOID_TOKEN.
      # ------------------------------------------------------------------
      - name: Checkout the-void (raw game-data captures)
        uses: actions/checkout@v4
        with:
          repository: chaerulanwarreborn-star/the-void
          token: ${{ secrets.THE_VOID_TOKEN }}
          path: the-void

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build events.json
        run: python scripts/extract_events.py

      - name: Build fog_island.json
        run: python scripts/extract_fog_island.py

      - name: Build Fog Island image cache
        run: python scripts/build_fog_assets.py

      - name: Build grid_island.json
        run: python scripts/extract_grid_island.py

      - name: Build tower_island.json
        run: python scripts/extract_tower_island.py

      - name: Build maze_island.json
        run: python scripts/extract_maze_island.py

      - name: Build heroic_race.json
        run: python scripts/extract_heroic_race.py

      - name: Build dragons.json
        run: python scripts/extract_dragons.py

      - name: Build skins.json
        run: python scripts/extract_skins.py

      - name: Build chests.json and chest detail shards
        run: python scripts/extract_chests.py

      - name: Build passes.json
        run: python scripts/extract_passes.py

      - name: Build event_collections.json
        run: python scripts/extract_event_collections.py

      - name: Build alliance_chest.json
        run: python scripts/extract_alliance_chest.py

      - name: Build arena_seasons.json
        run: python scripts/extract_arena_seasons.py

      - name: Commit generated data when changed
        shell: bash
        run: |
          git add dist/ chest-details

          if git diff --cached --quiet; then
            echo "Generated data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update DCIC generated data"
          git push
