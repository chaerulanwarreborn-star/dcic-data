name: Build DCIC data

on:
  push:
    branches:
      - main
    paths:
      - game_config.json
      - extract_events.py
      - extract_fog_island.py
      - build_fog_assets.py
      - event_overrides.json
      - .github/workflows/update-events.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build events.json
        run: python extract_events.py

      - name: Build fog_island.json
        run: python extract_fog_island.py

      - name: Build Fog Island image cache
        run: python build_fog_assets.py

      - name: Commit generated data when changed
        shell: bash
        run: |
          git add events.json fog_island.json fog_assets.json

          if git diff --cached --quiet; then
            echo "Generated data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update DCIC generated data"
          git push
