name: Build DCIC data

on:
  push:
    branches:
      - main
    paths:
      - game_config.json
      - localization/dragon_city_localization_baseline_en.json
      - extract_events.py
      - extract_fog_island.py
      - extract_grid_island.py
      - extract_tower_island.py
      - extract_maze_island.py
      - extract_chests.py
      - extract_alliance_chest.py
      - extract_heroic_race.py
      - legacy/heroic_races/**
      - heroic_race_archive_overrides.json
      - build_fog_assets.py
      - extract_dragons.py
      - extract_skins.py
      - skin_image_overrides.json
      - skill_description_overrides.json
      - arena_config.json
      - extract_arena_seasons.py
      - arena_overrides.json
      - event_overrides.json
      - .github/workflows/update-events.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build events.json
        run: python extract_events.py

      - name: Build fog_island.json
        run: python extract_fog_island.py

      - name: Build Fog Island image cache
        run: python build_fog_assets.py

      - name: Build grid_island.json
        run: python extract_grid_island.py

      - name: Build tower_island.json
        run: python extract_tower_island.py

      - name: Build maze_island.json
        run: python extract_maze_island.py

      - name: Build heroic_race.json
        run: python extract_heroic_race.py

      - name: Build dragons.json
        run: python extract_dragons.py

      - name: Build skins.json
        run: python extract_skins.py

      - name: Build chests.json and chest detail shards
        run: python extract_chests.py

      - name: Build alliance_chest.json
        run: python extract_alliance_chest.py --localization localization/dragon_city_localization_baseline_en.json

      - name: Build arena_seasons.json
        run: python extract_arena_seasons.py

      - name: Commit generated data when changed
        shell: bash
        run: |
          git add events.json fog_island.json fog_assets.json grid_island.json tower_island.json maze_island.json heroic_race.json dragons.json skins.json arena_seasons.json chests.json chest-details alliance_chest.json

          if git diff --cached --quiet; then
            echo "Generated data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update DCIC generated data"
          git push
