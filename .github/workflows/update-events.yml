name: Build DCIC events.json

on:
  push:
    branches:
      - main
    paths:
      - game_config.json
      - extract_events.py
      - event_overrides.json
      - .github/workflows/update-events.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build events.json
        run: python extract_events.py

      - name: Commit events.json when changed
        shell: bash
        run: |
          if git diff --quiet -- events.json; then
            echo "events.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Update events.json"
          git push
